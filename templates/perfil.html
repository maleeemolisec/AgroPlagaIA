{% extends 'base.html' %}
{% block titulo %}Mi perfil{% endblock %}
{% block contenido %}
<section class="tarjeta formulario angosto">
  <h1>Mi perfil</h1>
  <p class="aparte">{{ g.user.email }} · Rol: <b>{{ g.user.rol }}</b></p>
  <form method="post" novalidate data-validar>
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label>Nombre <input type="text" name="nombre" value="{{ g.user.nombre }}" required minlength="3"></label>
    <fieldset><legend>Cambiar contraseña (opcional)</legend>
      <label>Contraseña actual <input type="password" name="actual" autocomplete="current-password"></label>
      <label>Nueva contraseña <input type="password" name="nueva" minlength="8" autocomplete="new-password"></label>
    </fieldset>
    <button class="btn" type="submit">Guardar cambios</button>
  </form>
</section>
{% endblock %}
