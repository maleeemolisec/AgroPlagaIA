{% extends 'base.html' %}
{% block titulo %}Mi perfil{% endblock %}
{% block contenido %}
<section class="tarjeta formulario angosto">
  <h1>Mi perfil</h1>
  <p class="aparte">{{ g.user.email }} · Rol: <b>{{ g.user.rol }}</b></p>
  <form method="post" novalidate data-validar>
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label>Nombre <input type="text" name="nombre" value="{{ g.user.nombre }}" required minlength="3"></label>
    <fieldset><legend>Cambiar contraseña (opcional)</legend>
      <label>Contraseña actual
        <div class="password-field">
          <input type="password" name="actual" id="actual-password" autocomplete="current-password">
          <button class="password-toggle" type="button" data-password-toggle="actual-password"
                  aria-controls="actual-password" aria-pressed="false">Mostrar</button>
        </div>
      </label>
      <label>Nueva contraseña
        <div class="password-field">
          <input type="password" name="nueva" id="nueva-password" minlength="8" autocomplete="new-password">
          <button class="password-toggle" type="button" data-password-toggle="nueva-password"
                  aria-controls="nueva-password" aria-pressed="false">Mostrar</button>
        </div>
      </label>
    </fieldset>
    <button class="btn" type="submit">Guardar cambios</button>
  </form>
</section>
{% endblock %}
